name: Daily

# One workflow, one job, one place a failure surfaces (ADR-0003).
#
# The Run and the deploy deliberately share a job: if the Issue is generated but the
# deploy fails, that must be visible as a single red run rather than as a green run
# that left the site stale.
#
# `schedule` and `workflow_dispatch` will additionally perform the Run (fetch, gate,
# write). `push` deliberately does NOT — a push is either a human change to the site
# or the Run's own content commit, and re-running the pipeline on either would loop.

on:
  schedule:
    # 23:45 UTC = 06:45 Asia/Bangkok. Off-peak minute (GitHub's own docs warn that the
    # top of the hour is congested and runs may be delayed or dropped), and it leaves
    # ~15 minutes of slack before the intended 07:00 publish.
    - cron: '45 23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'content/**'
      - 'public/**'
      - 'pipeline/**'
      - 'state/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - 'tsconfig.json'
      - '.github/workflows/daily.yml'

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Astro 7 requires Node >= 22.12.
          node-version: '22.x'
          cache: npm

      - run: npm ci

      # The Run. Guarded to the scheduled and manual triggers: a push is either a human
      # change to the site or the Run's own content commit, and re-running the pipeline on
      # either would loop.
      #
      # It must come before Build, because Build is what puts the new Issue on the site.
      - name: Run
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Optional, and worth having: without it GitHub's advisory API and NVD both
          # rate-limit aggressively, and NVD is the slowest Source in the registry.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: node pipeline/cli.ts

      # The Issue and the Run's state are the only things that must survive the runner.
      # State especially: `state/sources.json` holds the per-Source watermark and
      # `state/seen.jsonl` the Seen set. Lose them and every Run re-reads the same window
      # and republishes the same Items.
      - name: Commit the Issue and the Run's state
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "daily-dev[bot]"
          git config user.email "daily-dev[bot]@users.noreply.github.com"
          git add content/issues state
          if git diff --cached --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          # The Issue's own date, not the runner's. They differ for six hours a day: this
          # Run fires at 23:45 UTC, which is already tomorrow in Bangkok, so `date -u`
          # labelled the 2026-09-19 Issue as 2026-09-18.
          ISSUE=$(git diff --cached --name-only -- 'content/issues/*.md' | head -1)
          LABEL=${ISSUE##*/}
          LABEL=${LABEL%.md}
          [ -n "$LABEL" ] || LABEL=$(date -u +%F)
          git commit -m "content: Issue for ${LABEL}"
          git push

      - name: Build
        run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
